services:
  # -------------------------------------------------------------
  # 1. Backend Express API Web Service
  # -------------------------------------------------------------
  - type: web
    name: focusflow-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

  # -------------------------------------------------------------
  # 2. Frontend Next.js Web Application
  # -------------------------------------------------------------
  - type: web
    name: focusflow-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: focusflow-backend
          property: host
