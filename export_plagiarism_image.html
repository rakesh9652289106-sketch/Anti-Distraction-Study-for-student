<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plagiarism Report Image - FocusFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-4xl w-full bg-slate-950 border border-slate-800 rounded-3xl p-6 shadow-2xl text-center">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-xl font-bold text-white text-left">Curiginal Plagiarism Report Image</h2>
        <p class="text-xs text-slate-400 text-left">For Slide 31: Similarity is 4% (less than 10% compliance)</p>
      </div>
      <button onclick="downloadPNG()" class="px-5 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-semibold text-xs shadow-lg shadow-orange-600/30 transition-all flex items-center gap-1.5">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span>Save as PNG Image</span>
      </button>
    </div>

    <!-- Live Preview Container -->
    <div class="bg-white rounded-2xl p-4 shadow-inner overflow-hidden border border-slate-700">
      <img id="report-img" src="plagiarism_report.svg" alt="Curiginal Plagiarism Report" class="w-full h-auto rounded-lg mx-auto" />
    </div>

    <canvas id="export-canvas" width="1800" height="1040" class="hidden"></canvas>
  </div>

  <script>
    function downloadPNG() {
      const img = document.getElementById('report-img');
      const canvas = document.getElementById('export-canvas');
      const ctx = canvas.getContext('2d');
      const tempImg = new Image();
      tempImg.onload = function() {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tempImg, 0, 0, canvas.width, canvas.height);
        const link = document.createElement('a');
        link.download = 'FocusFlow_Plagiarism_Report_Slide31.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      tempImg.src = 'plagiarism_report.svg';
    }
  </script>
</body>
</html>
